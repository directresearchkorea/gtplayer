
    <!DOCTYPE html><html><head><meta charset="UTF-8">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        width: 1080px; height: 1080px; overflow: hidden;
        font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        background: #ffffff;
        color: #111827;
    }
    .card {
        width: 1080px; height: 1080px;
        display: flex; flex-direction: column;
        position: relative; overflow: hidden;
    }
    .gradient-bg {
        /* Removed gradient */
    }
    .accent-circle {
        display: none;
    }
    .logo {
        font-size: 36px; font-weight: 900; letter-spacing: 1px;
        color: #000;
        text-transform: uppercase;
    }
    .logo span { color: #000; }
    .tag {
        display: inline-block;
        background: #f3f4f6;
        color: #111827;
        border: 1px solid #d1d5db;
        font-size: 34px; font-weight: 700;
        padding: 14px 28px; border-radius: 8px;
        letter-spacing: 1px;
    }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    </head>
    <body style="background:#ffffff; color:#111827; position:relative;">
    <div class="card" style="border: 20px solid #f9fafb; background:#ffffff; position:relative; overflow:hidden; width:1080px; height:1080px;">
        
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('https://i.ytimg.com/vi/m7BTKU4oDcE/hqdefault.jpg') no-repeat center center; background-size: cover; 
            filter: blur(100px) saturate(1.6); opacity: 0.25; z-index: 0;"></div>
        
        
        <div style="position:relative; z-index:2; padding:40px 50px; display:flex; flex-direction:column; height:100%; justify-content:space-between; background:transparent;">
            <!-- Header (소형화 및 사이드 배치) -->
            <div style="display:flex; justify-content:space-between; align-items:center; width: 100%; margin-bottom: 5px; padding: 0 10px;">
                <div class="logo" style="font-size:24px; font-weight:900;">GT<span>PLAYER</span></div>
                <div style="font-size:18px; color:#6b7280; font-weight:600;">#101 · 2026-08-12</div>
            </div>

            <!-- Main Visual (940px x 580px, 이미지 영역 최대화) -->
            
            <div style="margin: 5px auto; width: 940px; height: 580px; border-radius: 12px; overflow: hidden; 
                box-shadow: 0 15px 35px rgba(0,0,0,0.14); border: 1px solid #e5e7eb; background:#ffffff;">
                <img src="https://i.ytimg.com/vi/m7BTKU4oDcE/hqdefault.jpg" style="width: 100%; height: 100%; object-fit: cover;" />
            </div>
            

            <!-- Bottom content (구분선 제거, 이미지 바로 아래로 텍스트 배치) -->
            <div style="display: flex; flex-direction: column; gap: 14px; margin-top: auto; padding-top: 15px;">
                <h1 style="font-size: 42px; font-weight: 900; line-height: 1.35; color: #111827; letter-spacing: -1px; margin-bottom: 5px;">
                    오늘의 추천 OST 플레이리스트 🎧
                </h1>
                
                <!-- Footer -->
                <div style="border-top: 2px solid #000000; padding-top: 15px; margin-top: 5px;
                    display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <span style="font-size: 20px; color: #6b7280; font-weight: 600;">👉 Swipe to Read</span>
                    <span style="font-size: 18px; color: #111827; font-weight: 800;">gtplayer.net</span>
                </div>
            </div>
        </div>
    </div>
    </body></html>
